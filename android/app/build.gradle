plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace = "com.disciplina.app"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17
    }

    defaultConfig {
        applicationId = "com.disciplina.app"
        minSdk = flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
        // Necesario para Firebase Auth (permite el deep link de login).
        multiDexEnabled = true
    }

    buildTypes {
        release {
            // Para una app personal, firmamos con una clave generada en el build.
            // En GitHub Actions usamos un keystore firmado (ver workflow).
            signingConfig = signingConfigs.debug
        }
    }
}

flutter {
    source = "../.."
}
